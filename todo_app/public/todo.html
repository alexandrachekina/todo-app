<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Todo-Verwaltung</title>
    <link rel="stylesheet" href="../../node_modules/bootstrap/dist/css/bootstrap.css">
    <script type="module" src="js/todoApp.js" defer async></script>

</head>
<body>
<main class="container py-4">
    <h1 class="mb-4">Todo-Verwaltung</h1>
    <p>Todos anlegen, ansehen, bearbeiten und löschen. Die Daten werden nur im Arbeitsspeicher gehalten und gehen beim Neuladen verloren.</p>
    <button id="new-todo" type="button" class="btn btn-primary mb-4">Neues Todo</button>
    <dialog id="todo-dialog" class="col-11 col-md-8 col-lg-6 border-0 rounded shadow p-4 overflow-auto mh-100" aria-labelledby="form-heading">
        <h2 id="form-heading" class="h5">Neues Todo</h2>
        <form id="todo-form" novalidate>
            <div class="mb-3">
                <label for="todo-title" class="form-label">Titel (Pflichtfeld)</label>
                <input class="form-control" id="todo-title" name="title" required>
            </div>
            <div class="mb-3">
                <label for="todo-description" class="form-label">Beschreibung (Pflichtfeld)</label>
                <textarea class="form-control" id="todo-description" name="description" rows="2" required></textarea>
            </div>
            <div class="mb-3">
                <label for="todo-priority" class="form-label">Priorität</label>
                <select class="form-select" id="todo-priority" name="priority">
                    <option value="hoch">hoch</option>
                    <option value="mittel" selected>mittel</option>
                    <option value="niedrig">niedrig</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="todo-due-date" class="form-label">Fälligkeitsdatum (optional)</label>
                <input type="date" class="form-control" id="todo-due-date" name="dueDate">
            </div>
            <div class="mb-3">
                <label for="todo-status" class="form-label">Status</label>
                <select class="form-select" id="todo-status" name="status">
                    <option value="offen">offen</option>
                    <option value="in Bearbeitung">in Bearbeitung</option>
                    <option value="erledigt">erledigt</option>
                </select>
            </div>
            <div id="error-msg" class="alert alert-danger d-none" role="alert"></div>
            <button id="submit-todo" type="submit" class="btn btn-primary">Todo hinzufügen</button>
            <button id="cancel-edit" type="button" class="btn btn-secondary">Abbrechen</button>
        </form>
    </dialog>
    <section aria-labelledby="list-heading">
        <h2 id="list-heading" class="h4">Todos</h2>
        <p class="text-body-secondary">„Details anzeigen“ öffnet Beschreibung und weitere Angaben. „Bearbeiten“ öffnet das Todo im Dialog.</p>
        <div id="todo-list"></div>
    </section>
    <section class="card p-3 mt-4" aria-labelledby="stats-heading">
        <h2 id="stats-heading" class="h5">Statistik</h2>
        <div id="stats" role="status" aria-live="polite"></div>
    </section>
</main>
</body>
</html>
